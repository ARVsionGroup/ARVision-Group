<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo-icon.png" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Arvision is a technology company building AI, ERP and software solutions that help businesses see further and move faster."
    />
    <title>Arvision — Our Vision</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('arvision-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
